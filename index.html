<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1017">
<title>NetLab Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1017; --rack:#0f151e; --panel:#131b25; --panel2:#18222e; --line:#243343;
  --txt:#e3ecf5; --mut:#7f93aa; --dim:#54677d;
  --led:#2ee6a0; --amber:#ffb020; --red:#ff4d6d; --blue:#3ba7ff; --orange:#ff8a3d; --violet:#a78bfa;
  --r:10px; --sh:0 8px 26px rgba(0,0,0,.45);
  --ui:'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:var(--ui);font-size:14px;
  display:flex;flex-direction:column;overscroll-behavior:none}
button,input,select,textarea{font-family:inherit;font-size:13px;color:var(--txt)}
button{cursor:pointer}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#233142;border-radius:8px}

/* ── top bar ─────────────────────────────── */
#top{height:52px;flex:0 0 52px;display:flex;align-items:center;gap:8px;padding:0 10px;
  background:linear-gradient(#141d28,#0e151e);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);height:calc(52px + env(safe-area-inset-top));flex-basis:auto}
.brand{display:flex;align-items:center;gap:9px;padding-right:10px;flex:0 0 auto}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--led);box-shadow:0 0 10px var(--led);animation:pulse 2.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.brand b{font-weight:700;letter-spacing:.02em;font-size:15px}
.brand span{color:var(--dim);font-size:10px;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase}
#tools{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;padding:0 2px}
#tools::-webkit-scrollbar{display:none}
.tb{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 11px;
  white-space:nowrap;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;transition:.14s}
.tb:hover{background:var(--panel2);border-color:#31465c}
.tb.on{background:rgba(46,230,160,.13);border-color:var(--led);color:var(--led)}
.tb.warn.on{background:rgba(255,176,32,.14);border-color:var(--amber);color:var(--amber)}
.tb i{font-style:normal;font-family:var(--mono);font-size:13px}

/* ── layout ──────────────────────────────── */
#main{flex:1;display:flex;min-height:0;position:relative}
aside{background:var(--rack);display:flex;flex-direction:column;min-height:0}
#palette{width:238px;flex:0 0 238px;border-right:1px solid var(--line)}
#insp{width:300px;flex:0 0 300px;border-left:1px solid var(--line)}
.ahead{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.ahead h3{margin:0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:600}
.ascroll{flex:1;overflow-y:auto;padding:8px}
.cat{margin-bottom:4px}
.cat>summary{list-style:none;cursor:pointer;padding:8px 10px;border-radius:8px;font-size:12px;font-weight:600;
  color:var(--mut);display:flex;justify-content:space-between;align-items:center;letter-spacing:.04em}
.cat>summary::-webkit-details-marker{display:none}
.cat>summary:hover{background:var(--panel);color:var(--txt)}
.cat[open]>summary{color:var(--txt)}
.cat>summary::after{content:'+';font-family:var(--mono);color:var(--dim)}
.cat[open]>summary::after{content:'–'}
.pit{display:flex;gap:9px;align-items:center;padding:7px 8px;border-radius:8px;cursor:grab;border:1px solid transparent}
.pit:hover{background:var(--panel);border-color:var(--line)}
.pit:active{cursor:grabbing;background:var(--panel2)}
.pit svg{flex:0 0 42px;width:42px;height:30px}
.pit .nm{font-size:12px;line-height:1.25;font-weight:500}
.pit .br{font-size:10px;color:var(--dim);font-family:var(--mono);letter-spacing:.03em}

/* ── stage ───────────────────────────────── */
#stage{flex:1;position:relative;min-width:0;background:
  radial-gradient(1100px 600px at 50% 0%,#101923 0%,var(--bg) 70%)}
#cv{width:100%;height:100%;display:block;touch-action:none}
.dev{cursor:pointer}
.dev.sel .selring{opacity:1}
.selring{opacity:0;stroke:var(--blue);stroke-width:2;fill:none;stroke-dasharray:5 4}
.dname{font-family:var(--ui);font-size:11px;font-weight:600;fill:var(--txt);text-anchor:middle}
.dsub{font-family:var(--mono);font-size:8.5px;fill:var(--dim);text-anchor:middle;letter-spacing:.03em}
.dip{font-family:var(--mono);font-size:9px;fill:var(--blue);text-anchor:middle}
.link{stroke-width:2.4;fill:none;stroke-linecap:round}
.link.hit{stroke:transparent;stroke-width:16;cursor:pointer}
.link.sel{stroke-dasharray:7 5}
#hud{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.chip{pointer-events:auto;background:rgba(14,20,28,.9);border:1px solid var(--line);border-radius:20px;
  padding:5px 11px;font-size:11px;font-family:var(--mono);color:var(--mut);backdrop-filter:blur(8px)}
.chip b{color:var(--txt);font-weight:500}
#zoomer{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
#zoomer button{width:38px;height:38px;border-radius:10px;background:rgba(19,27,37,.92);border:1px solid var(--line);
  font-size:17px;font-family:var(--mono);backdrop-filter:blur(8px)}
#banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(19,27,37,.95);
  border:1px solid var(--blue);color:var(--blue);padding:8px 14px;border-radius:20px;font-size:12px;
  display:none;align-items:center;gap:8px;backdrop-filter:blur(8px);box-shadow:var(--sh);z-index:5;max-width:92%}
#banner.show{display:flex}
#banner button{background:none;border:none;color:var(--dim);font-size:16px;padding:0 2px}

/* ── inspector ───────────────────────────── */
.empty{padding:26px 16px;color:var(--dim);font-size:12.5px;line-height:1.7;text-align:center}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:12.5px;border-bottom:1px solid rgba(36,51,67,.5)}
.row span{color:var(--mut)}
.row b{font-weight:500;font-family:var(--mono);font-size:11.5px;text-align:right}
.sec{padding:12px}
.sec h4{margin:0 0 8px;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--mut);font-weight:600}
.btn{display:block;width:100%;padding:10px;border-radius:9px;background:var(--panel);border:1px solid var(--line);
  font-weight:600;font-size:13px;margin-bottom:7px;transition:.14s}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--led);color:#04140e;border-color:var(--led)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dgr{color:var(--red);border-color:rgba(255,77,109,.35)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:5px}
.pchip{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 4px;text-align:center;
  font-family:var(--mono);font-size:9.5px;line-height:1.35;cursor:pointer}
.pchip .st{display:block;font-size:8px;letter-spacing:.06em}
.pchip.up{border-color:rgba(46,230,160,.5)} .pchip.up .st{color:var(--led)}
.pchip.down .st{color:var(--dim)}
.pchip.dis{opacity:.45} .pchip.dis .st{color:var(--red)}
.pchip.sfp{border-style:dashed;border-color:var(--violet)}

/* ── modal ───────────────────────────────── */
#modal{position:fixed;inset:0;background:rgba(4,8,12,.72);backdrop-filter:blur(4px);z-index:50;
  display:none;align-items:center;justify-content:center;padding:20px}
#modal.show{display:flex}
.sheet{background:var(--rack);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);
  width:100%;max-width:860px;height:min(88vh,760px);display:flex;flex-direction:column;overflow:hidden}
.shead{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:var(--panel)}
.shead .t{flex:1;min-width:0}
.shead h2{margin:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shead p{margin:1px 0 0;font-size:10.5px;color:var(--dim);font-family:var(--mono);letter-spacing:.04em}
.x{background:none;border:1px solid var(--line);border-radius:8px;width:32px;height:32px;font-size:16px;color:var(--mut)}
.tabs{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;background:var(--rack)}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:1px solid transparent;border-radius:7px;padding:7px 12px;font-size:12px;
  color:var(--mut);white-space:nowrap;font-weight:500}
.tab.on{background:var(--panel2);color:var(--txt);border-color:var(--line)}
.body{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
label.f{display:block;margin-bottom:9px}
label.f span{display:block;font-size:10.5px;color:var(--mut);margin-bottom:4px;letter-spacing:.05em;text-transform:uppercase}
input,select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:9px 10px;font-family:var(--mono);font-size:12.5px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
input[type=checkbox]{width:auto;accent-color:var(--led)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);
  padding:7px 6px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:6px;border-bottom:1px solid rgba(36,51,67,.45);font-family:var(--mono);font-size:11.5px;vertical-align:middle}
td input,td select{padding:5px 6px;font-size:11px}
.tag{display:inline-block;padding:2px 7px;border-radius:5px;font-size:9.5px;font-family:var(--mono);letter-spacing:.05em}
.tag.up{background:rgba(46,230,160,.15);color:var(--led)}
.tag.dn{background:rgba(84,103,125,.18);color:var(--dim)}
.tag.er{background:rgba(255,77,109,.15);color:var(--red)}
.tag.wr{background:rgba(255,176,32,.15);color:var(--amber)}
#term{background:#070b10;border:1px solid var(--line);border-radius:10px;padding:12px;font-family:var(--mono);
  font-size:12px;line-height:1.55;height:340px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
#term .in{color:var(--led)} #term .er{color:var(--red)} #term .ok{color:var(--mut)}
.cmdline{display:flex;gap:7px;margin-top:9px;align-items:center}
.cmdline span{font-family:var(--mono);color:var(--led);font-size:12px}
.step{border-left:2px solid var(--line);padding:0 0 14px 14px;margin-left:6px;position:relative}
.step:before{content:'';position:absolute;left:-6px;top:3px;width:10px;height:10px;border-radius:50%;
  background:var(--rack);border:2px solid var(--dim)}
.step.done:before{background:var(--led);border-color:var(--led)}
.step h5{margin:0 0 4px;font-size:13px;font-weight:600}
.step p{margin:0;color:var(--mut);font-size:12.5px;line-height:1.6}
.step code{background:var(--panel);padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:11.5px;color:var(--orange)}
.note{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:8px;
  padding:10px 12px;font-size:12.5px;line-height:1.6;color:var(--mut);margin-bottom:12px}
.note.ok{border-left-color:var(--led)} .note.er{border-left-color:var(--red)} .note.wr{border-left-color:var(--amber)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--panel2);
  border:1px solid var(--line);border-radius:10px;padding:11px 16px;font-size:12.5px;box-shadow:var(--sh);
  opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.er{border-color:var(--red)} #toast.ok{border-color:var(--led)}
.mobtog{display:none}

@media(max-width:900px){
  #palette{position:absolute;left:0;right:0;bottom:0;top:auto;width:auto;flex:none;height:58vh;z-index:20;
    border-right:none;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:var(--sh);
    transform:translateY(100%);transition:transform .28s cubic-bezier(.3,1,.4,1)}
  #insp{position:absolute;left:0;right:0;bottom:0;top:auto;width:auto;flex:none;height:58vh;z-index:21;
    border-left:none;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:var(--sh);
    transform:translateY(100%);transition:transform .28s cubic-bezier(.3,1,.4,1)}
  #palette.open,#insp.open{transform:translateY(0)}
  .mobtog{display:flex}
  #modal{padding:0}
  .sheet{max-width:none;height:100%;border-radius:0;border:none}
  #hud{bottom:auto;top:10px;left:8px}
  #zoomer{bottom:76px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header id="top">
  <div class="brand"><div class="dot"></div><div><b>NetLab</b> <span>simulator</span></div></div>
  <div id="tools">
    <button class="tb mobtog" onclick="togglePane('palette')"><i>▤</i> Perangkat</button>
    <button class="tb" id="btnCable" onclick="toggleCable()"><i>⌁</i> Pasang kabel</button>
    <button class="tb warn" id="btnSim" onclick="toggleSim()"><i>▶</i> Jalankan simulasi</button>
    <button class="tb" onclick="openTest()"><i>◎</i> Uji koneksi</button>
    <button class="tb" onclick="openCheck()"><i>✓</i> Cek konfigurasi</button>
    <button class="tb" onclick="undo()"><i>↶</i></button>
    <button class="tb" onclick="redo()"><i>↷</i></button>
    <button class="tb" onclick="autoArrange()"><i>⊞</i> Rapikan</button>
    <button class="tb" onclick="openProjects()"><i>⛁</i> Project</button>
    <button class="tb mobtog" onclick="togglePane('insp')"><i>☰</i> Detail</button>
  </div>
</header>
<div id="main">
  <aside id="palette">
    <div class="ahead"><h3>Katalog perangkat</h3><button class="x mobtog" onclick="togglePane('palette')">×</button></div>
    <div class="ascroll" id="palList"></div>
  </aside>
  <div id="stage">
    <svg id="cv"><g id="world"><g id="gGrid"></g><g id="gLinks"></g><g id="gAnim"></g><g id="gDev"></g></g></svg>
    <div id="banner"><span id="bannerTxt"></span><button onclick="hideBanner()">×</button></div>
    <div id="hud"><div class="chip" id="hudStat">Perangkat <b>0</b> · Link <b>0</b></div></div>
    <div id="zoomer">
      <button onclick="zoomBy(1.25)">+</button>
      <button onclick="zoomBy(.8)">−</button>
      <button onclick="fitView()" style="font-size:13px">⤢</button>
    </div>
  </div>
  <aside id="insp">
    <div class="ahead"><h3>Detail perangkat</h3><button class="x mobtog" onclick="togglePane('insp')">×</button></div>
    <div class="ascroll" id="inspBody"></div>
  </aside>
</div>
<div id="modal" onclick="if(event.target===this)closeModal()">
  <div class="sheet">
    <div class="shead"><div class="t"><h2 id="mTitle">—</h2><p id="mSub"></p></div><button class="x" onclick="closeModal()">×</button></div>
    <div class="tabs" id="mTabs"></div>
    <div class="body" id="mBody"></div>
  </div>
</div>
<div id="toast"></div>
<script>
/* ══════════════════════════════════════════════════════════════
   NetLab Simulator — katalog perangkat, state, dan rendering
   ══════════════════════════════════════════════════════════════ */
const NS='http://www.w3.org/2000/svg';
const el=(t,a={})=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);return n};
const $=id=>document.getElementById(id);
const uid=p=>p+Math.random().toString(36).slice(2,8);

/* ── definisi port ─────────────────────────── */
const pt=(name,kind,x={})=>Object.assign({
  name,kind,enabled:true,speed:kind==='sfp+'?10000:1000,duplex:'full',
  mode:'access',vlan:1,allowed:'1-4094',native:1,desc:'',ip:'',mask:'255.255.255.0',
  poeOut:false,poeIn:false},x);
const seq=(fmt,n,kind,x={},from=1)=>Array.from({length:n},(_,i)=>pt(fmt.replace('#',from+i),kind,x));

/* ── katalog ───────────────────────────────── */
const T={};
const D=(key,o)=>{T[key]=Object.assign({key,feats:{},power:'ac',watt:0,poeBudget:0},o)};
const CATS=[
  ['router','Router / Gateway'],['switch','Switch'],['poe','Switch PoE'],['ap','Access Point'],
  ['cctv','Kamera CCTV'],['nvr','NVR / Recorder'],['fiber','Fiber Optic'],['server','Server'],['end','End Device']];

// ROUTER
D('mt-hex',{cat:'router',brand:'MikroTik',model:'hEX RB750Gr3',cli:'mikrotik',shape:'rack',
  feats:{l3:1,route:1,dhcp:1,host:1},ports:()=>[...seq('ether#',5,'rj45')]});
D('mt-rb4011',{cat:'router',brand:'MikroTik',model:'RB4011iGS+',cli:'mikrotik',shape:'rack',
  feats:{l3:1,route:1,dhcp:1,host:1},ports:()=>[...seq('ether#',10,'rj45'),pt('sfp-sfpplus1','sfp+')]});
D('mt-hapax2',{cat:'router',brand:'MikroTik',model:'hAP ax²',cli:'mikrotik',shape:'rack',
  feats:{l3:1,route:1,dhcp:1,wifi:1,host:1,br:1,bands:['2.4','5']},ports:()=>[...seq('ether#',5,'rj45'),pt('wlan0','wifi')]});
D('rj-eg105gp',{cat:'router',brand:'Ruijie',model:'EG105G-P V2',cli:'ruijie',shape:'rack',poeBudget:54,
  feats:{l3:1,route:1,dhcp:1,poe:1,host:1},ports:()=>[pt('Gi0/0','rj45'),...seq('Gi0/#',4,'rj45',{poeOut:true},1)]});
D('cisco-isr1111',{cat:'router',brand:'Cisco',model:'ISR 1111-8P',cli:'cisco',shape:'rack',
  feats:{l3:1,route:1,dhcp:1,host:1},ports:()=>[pt('GigabitEthernet0/0/0','rj45'),pt('GigabitEthernet0/0/1','rj45'),...seq('GigabitEthernet0/1/#',8,'rj45',{},0)]});
D('tp-er605',{cat:'router',brand:'TP-Link',model:'ER605 Omada',cli:null,shape:'rack',
  feats:{l3:1,route:1,dhcp:1,host:1},ports:()=>[pt('WAN','rj45'),...seq('LAN#',4,'rj45')]});

// SWITCH
D('rj-nbs3100-24',{cat:'switch',brand:'Ruijie',model:'RG-NBS3100-24GT4SFP',cli:'ruijie',shape:'rack',
  feats:{sw:1,host:1,dhcp:1},ports:()=>[...seq('Gi0/#',24,'rj45'),...seq('Te0/#',4,'sfp+',{},25)]});
D('rj-es109gd',{cat:'switch',brand:'Ruijie',model:'RG-ES109GD (unmanaged)',cli:null,shape:'rack',
  feats:{sw:1,unmanaged:1},ports:()=>[...seq('P#',9,'rj45')]});
D('cisco-c1000',{cat:'switch',brand:'Cisco',model:'Catalyst C1000-24T-4G-L',cli:'cisco',shape:'rack',
  feats:{sw:1,host:1},ports:()=>[...seq('GigabitEthernet1/0/#',24,'rj45'),...seq('GigabitEthernet1/1/#',4,'sfp')]});
D('mt-crs328',{cat:'switch',brand:'MikroTik',model:'CRS328-24P-4S+',cli:'mikrotik',shape:'rack',poeBudget:450,
  feats:{sw:1,host:1,poe:1},ports:()=>[...seq('ether#',24,'rj45',{poeOut:true}),...seq('sfp-sfpplus#',4,'sfp+')]});
D('tp-sg1008d',{cat:'switch',brand:'TP-Link',model:'TL-SG1008D (unmanaged)',cli:null,shape:'rack',
  feats:{sw:1,unmanaged:1},ports:()=>[...seq('P#',8,'rj45')]});

// SWITCH PoE
D('rj-nbs3100-8p',{cat:'poe',brand:'Ruijie',model:'RG-NBS3100-8GT2SFP-P',cli:'ruijie',shape:'rack',poeBudget:110,
  feats:{sw:1,poe:1,host:1,dhcp:1},ports:()=>[...seq('Gi0/#',8,'rj45',{poeOut:true}),...seq('Gi0/#',2,'sfp',{},9)]});
D('tp-sg2210mp',{cat:'poe',brand:'TP-Link',model:'TL-SG2210MP Omada',cli:null,shape:'rack',poeBudget:150,
  feats:{sw:1,poe:1,host:1},ports:()=>[...seq('P#',8,'rj45',{poeOut:true}),...seq('SFP#',2,'sfp')]});

let S={devices:[],links:[],name:'Topologi baru',ver:1};

const dev=id=>S.devices.find(d=>d.id===id);

function snap(){hist.push(JSON.stringify(S));if(hist.length>60)hist.shift();future=[];}
function undo(){if(!hist.length)return toast('Tidak ada langkah untuk dibatalkan');future.push(JSON.stringify(S));S=JSON.parse(hist.pop());sel=null;render();toast('Langkah dibatalkan')}

function addDevice(key,x,y){
  const t=T[key],ports=t.ports();
  const n=S.devices.filter(d=>d.key===key).length+1;
  const d={id:uid('d'),key,name:shortName(t)+'-'+n,x:Math.round(x/20)*20,y:Math.round(y/20)*20,ports,on:true,
    cfg:{ip:'',mask:'255.255.255.0',gw:'',dns:'8.8.8.8',dhcpClient:t.feats.client?true:false,
      vlans:[{id:1,name:'default'}],routes:[],
      dhcp:{on:false,net:'',start:'',end:'',gw:'',dns:'8.8.8.8',lease:'12h',excl:''},
      wifi:{ssid:'',pass:'',sec:'WPA2-PSK',vlan:1,ch:'auto',bw:'40 MHz',tx:'High',b24:true,b5:true,b6:false},
      poe:{on:true,budget:t.poeBudget||0},
      joinSsid:'', hostname:''},
    cli:{mode:'user',ctx:null,ctxVlan:null,log:[]},
    serial:'SN'+Math.random().toString(36).slice(2,10).toUpperCase(),
    mac:macGen(), boot:Date.now()};
  S.devices.push(d); return d;
}
function shortName(t){
  return ({router:'R',switch:'SW',poe:'PoE-SW',ap:'AP',cctv:'CAM',nvr:'NVR',fiber:'FO',server:'SRV',end:'PC'})[t.cat]||'DEV';
}
function macGen(){const h=()=>Math.floor(Math.random()*256).toString(16).padStart(2,'0').toUpperCase();
  return ['00','1A',h(),h(),h(),h()].join(':')}

/* ── gambar perangkat (SVG) ────────────────── */
function size(d){
  const t=tpl(d),n=d.ports.length;
  if(t.shape==='rack'){const two=n>14,cols=two?Math.ceil(n/2):n;return{w:Math.max(126,40+cols*13),h:two?58:46}}
  if(t.shape==='apc'||t.shape==='apo')return{w:60,h:60};
  if(t.shape==='apw')return{w:52,h:66};
  if(t.shape==='bullet')return{w:76,h:40};
  if(t.shape==='dome')return{w:58,h:44};
  if(t.shape==='box'||t.shape==='onu')return{w:78,h:44};
  return{w:62,h:52};
}
function portColor(d,p){
  if(!d.on)return '#26313d';
  if(!p.enabled)return '#8a3040';
  const l=linkOf(d.id,p.name);
  if(l&&l.up)return p.poeOut&&poeActive(d,p)?'#ffb020':'#2ee6a0';
  return '#2a3a4b';
}
function drawDevice(d,preview){
  const t=tpl(d),{w,h}=size(d),g=el('g',{class:'dev'+(sel===d.id?' sel':''),'data-id':d.id});
  if(!preview)g.setAttribute('transform',`translate(${d.x},${d.y})`);
  g.appendChild(el('rect',{class:'selring',x:-8,y:-8,width:w+16,height:h+16,rx:12}));
  const body=(fill='#1c2733')=>{
    g.appendChild(el('rect',{x:2,y:4,width:w,height:h,rx:6,fill:'#000',opacity:.35}));
    g.appendChild(el('rect',{x:0,y:0,width:w,height:h,rx:6,fill:fill,stroke:'#31465c'}));
  };
  const txt=(s,x,y,cl,anchor)=>{const n=el('text',{x,y,class:cl||'dsub'});if(anchor)n.setAttribute('text-anchor',anchor);n.textContent=s;g.appendChild(n);return n};
  const led=(x,y,on,c)=>g.appendChild(el('circle',{cx:x,cy:y,r:2.6,fill:on?(c||'#2ee6a0'):'#2a3a4b'}));

  if(t.shape==='rack'){
    body(t.cat==='nvr'?'#1a222c':'#1c2733');
    g.appendChild(el('rect',{x:0,y:0,width:w,height:11,rx:6,fill:'#243343'}));
    g.appendChild(el('rect',{x:0,y:7,width:w,height:5,fill:'#243343'}));
    txt(t.brand.toUpperCase(),6,8.5).setAttribute('font-size','6.5');
    led(w-9,5.5,d.on,'#2ee6a0'); led(w-18,5.5,d.on&&simOn,'#3ba7ff');
    const two=d.ports.length>14,cols=two?Math.ceil(d.ports.length/2):d.ports.length;
    const pw=Math.min(11,(w-14)/cols-2);
    d.ports.forEach((p,i)=>{
      const r=two&&i>=cols?1:0,c=two?(i%cols):i;
      const x=7+c*(pw+2),y=17+r*13;
      const rc=el('rect',{x,y,width:pw,height:9,rx:1.6,fill:portColor(d,p),stroke:'#0d141c','stroke-width':.6,
        'data-port':p.name,class:'pdot'});
      if(p.kind!=='rj45')rc.setAttribute('rx',4);
      g.appendChild(rc);
    });
    txt(t.model,w/2,h-4,'dsub','middle');
  }
  else if(t.shape==='apc'){
    g.appendChild(el('circle',{cx:w/2,cy:h/2+2,r:w/2-1,fill:'#000',opacity:.3}));
    g.appendChild(el('circle',{cx:w/2,cy:h/2,r:w/2-2,fill:'#f2f4f7',stroke:'#c7ced6'}));
    g.appendChild(el('circle',{cx:w/2,cy:h/2,r:w/2-9,fill:'none',stroke:'#dfe4ea','stroke-width':1.4}));
    g.appendChild(el('circle',{cx:w/2,cy:h/2,r:5,fill:d.on?'#2ee6a0':'#b9c2cc'}));
    if(d.on&&simOn)g.appendChild(el('circle',{cx:w/2,cy:h/2,r:5,fill:'none',stroke:'#2ee6a0','stroke-width':1.5,opacity:.5}));
  }
  else if(t.shape==='apo'){
    body('#e8ebef');
    g.appendChild(el('rect',{x:6,y:6,width:w-12,height:h-12,rx:4,fill:'none',stroke:'#c2c9d2'}));
    [0,1].forEach(i=>g.appendChild(el('rect',{x:w/2-10+i*14,y:-9,width:5,height:11,rx:2,fill:'#8f9aa6'})));
    g.appendChild(el('circle',{cx:w/2,cy:h/2,r:4,fill:d.on?'#2ee6a0':'#b9c2cc'}));
  }
  else if(t.shape==='apw'){
    body('#eef1f4');
    g.appendChild(el('rect',{x:8,y:8,width:w-16,height:20,rx:3,fill:'#dde3e9'}));
    led(w/2,h-22,d.on);
    [0,1,2].forEach(i=>g.appendChild(el('rect',{x:9+i*12,y:h-14,width:9,height:7,rx:1.5,fill:'#4b5866'})));
  }
  else if(t.shape==='bullet'){
    g.appendChild(el('rect',{x:14,y:8,width:w-22,height:22,rx:11,fill:'#e9edf1',stroke:'#c3cad2'}));
    g.appendChild(el('circle',{cx:w-9,cy:19,r:9,fill:'#1a222c',stroke:'#c3cad2'}));
    g.appendChild(el('circle',{cx:w-9,cy:19,r:4,fill:d.on?'#2b3d52':'#141c25'}));
    g.appendChild(el('rect',{x:6,y:26,width:8,height:12,rx:2,fill:'#aab4bf'}));
    g.appendChild(el('rect',{x:2,y:36,width:16,height:4,rx:2,fill:'#8f9aa6'}));
    led(20,14,d.on,'#ff4d6d');
  }
  else if(t.shape==='dome'){
    g.appendChild(el('path',{d:`M4 ${h-8} a${w/2-4} ${h-14} 0 0 1 ${w-8} 0 z`,fill:'#e9edf1',stroke:'#c3cad2'}));
    g.appendChild(el('rect',{x:2,y:h-9,width:w-4,height:6,rx:3,fill:'#cfd6dd'}));
    g.appendChild(el('circle',{cx:w/2,cy:h-20,r:8,fill:'#1a222c'}));
    g.appendChild(el('circle',{cx:w/2,cy:h-20,r:3.4,fill:d.on?'#2b3d52':'#141c25'}));
  }
  else if(t.shape==='box'||t.shape==='onu'){
    body(t.shape==='onu'?'#e9edf1':'#20303e');
    txt(t.model.split(' ')[0],w/2,h/2+1,'dsub','middle').setAttribute('fill',t.shape==='onu'?'#5a6a7a':'#8fa4bb');
    d.ports.slice(0,10).forEach((p,i)=>g.appendChild(el('rect',{x:5+i*7,y:h-11,width:5,height:7,rx:1.5,fill:portColor(d,p)})));
    led(w-8,8,d.on);
  }
  else{ // end devices
    const c='#dfe5ec';
    if(t.shape==='pc'){
      g.appendChild(el('rect',{x:4,y:4,width:w-8,height:h-18,rx:3,fill:'#101820',stroke:'#c3cad2','stroke-width':2}));
      g.appendChild(el('rect',{x:7,y:7,width:w-14,height:h-24,rx:2,fill:d.on?'#12303c':'#0b1017'}));
      g.appendChild(el('rect',{x:w/2-9,y:h-14,width:18,height:5,fill:'#aab4bf'}));
      g.appendChild(el('rect',{x:w/2-16,y:h-9,width:32,height:4,rx:2,fill:'#8f9aa6'}));
    } else if(t.shape==='laptop'){
      g.appendChild(el('rect',{x:8,y:5,width:w-16,height:h-20,rx:3,fill:'#101820',stroke:'#c3cad2','stroke-width':2}));
      g.appendChild(el('rect',{x:11,y:8,width:w-22,height:h-26,rx:2,fill:d.on?'#12303c':'#0b1017'}));
      g.appendChild(el('path',{d:`M2 ${h-13} h${w-4} l4 8 h${-w-4} z`,fill:'#c3cad2'}));
    } else if(t.shape==='phone'){
      g.appendChild(el('rect',{x:w/2-13,y:3,width:26,height:h-6,rx:5,fill:'#101820',stroke:'#c3cad2','stroke-width':2}));
      g.appendChild(el('rect',{x:w/2-10,y:8,width:20,height:h-18,rx:2,fill:d.on?'#12303c':'#0b1017'}));
    } else if(t.shape==='printer'){
      g.appendChild(el('rect',{x:6,y:14,width:w-12,height:h-22,rx:3,fill:'#20303e',stroke:'#c3cad2'}));
      g.appendChild(el('rect',{x:14,y:4,width:w-28,height:12,rx:2,fill:c}));
      g.appendChild(el('rect',{x:12,y:h-14,width:w-24,height:9,rx:2,fill:'#f4f7fa'}));
      led(w-12,20,d.on);
    } else if(t.shape==='ipphone'){
      g.appendChild(el('rect',{x:5,y:12,width:w-10,height:h-16,rx:4,fill:'#20303e',stroke:'#c3cad2'}));
      g.appendChild(el('rect',{x:10,y:16,width:w-20,height:11,rx:2,fill:d.on?'#12303c':'#0b1017'}));
      g.appendChild(el('rect',{x:3,y:5,width:w-6,height:8,rx:4,fill:'#aab4bf'}));
    } else if(t.shape==='tv'){
      g.appendChild(el('rect',{x:2,y:5,width:w-4,height:h-18,rx:3,fill:'#101820',stroke:'#c3cad2','stroke-width':2}));
      g.appendChild(el('rect',{x:5,y:8,width:w-10,height:h-24,rx:2,fill:d.on?'#12303c':'#0b1017'}));
      g.appendChild(el('rect',{x:w/2-10,y:h-11,width:20,height:4,rx:2,fill:'#8f9aa6'}));
    } else { // iot
      g.appendChild(el('circle',{cx:w/2,cy:h/2,r:16,fill:'#20303e',stroke:'#c3cad2'}));
      g.appendChild(el('circle',{cx:w/2,cy:h/2,r:6,fill:d.on?'#2ee6a0':'#3a4757'}));
    }
  }
  if(!preview){
    txt(d.name,w/2,-10,'dname','middle');
    const ipl=primaryIP(d);
    if(ipl)txt(ipl,w/2,h+13,'dip','middle');
    else if(tpl(d).feats.host)txt('no IP',w/2,h+13,'dsub','middle');
    if(tpl(d).power==='poe'&&!d.on)txt('⚡ no power',w/2,h+24,'dsub','middle').setAttribute('fill','#ff4d6d');
  }
  return g;
}
function primaryIP(d){
  if(tpl(d).feats.l3){const p=d.ports.find(p=>p.ip);return p?p.ip:''}
  return d.cfg.ip||'';
}

const cv=$('cv'),world=$('world'),gGrid=$('gGrid'),gLinks=$('gLinks'),gDev=$('gDev'),gAnim=$('gAnim');

function linkOf(devId,portName){return S.links.find(l=>(l.a.d===devId&&l.a.p===portName)||(l.b.d===devId&&l.b.p===portName))}
function linksOf(devId,portName){return S.links.filter(l=>(l.a.d===devId&&l.a.p===portName)||(l.b.d===devId&&l.b.p===portName))}
function peer(l,devId){return l.a.d===devId?l.b:l.a}
function portPos(d,pn){
  const t=tpl(d),{w,h}=size(d),i=d.ports.findIndex(p=>p.name===pn);
  if(t.shape==='rack'){
    const two=d.ports.length>14,cols=two?Math.ceil(d.ports.length/2):d.ports.length;
    const pw=Math.min(11,(w-14)/cols-2),r=two&&i>=cols?1:0,c=two?(i%cols):i;
    return{x:d.x+7+c*(pw+2)+pw/2,y:d.y+17+r*13+4.5};
  }
  if(t.shape==='box'||t.shape==='onu')return{x:d.x+7.5+Math.min(i,9)*7,y:d.y+h-7};
  return{x:d.x+w/2,y:d.y+h/2};
}
function drawGrid(){
  gGrid.innerHTML='';
  const defs=el('defs'),p=el('pattern',{id:'grid',width:24,height:24,patternUnits:'userSpaceOnUse'});
  p.appendChild(el('path',{d:'M24 0 H0 V24',fill:'none',stroke:'#16202b','stroke-width':1}));
  defs.appendChild(p);gGrid.appendChild(defs);
  gGrid.appendChild(el('rect',{x:-4000,y:-4000,width:9000,height:9000,fill:'url(#grid)'}));
}
function render(){
  world.setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`);
  gLinks.innerHTML='';gDev.innerHTML='';
  computeState();
  S.links.forEach(l=>{
    const A=dev(l.a.d),B=dev(l.b.d);if(!A||!B)return;
    const a=portPos(A,l.a.p),b=portPos(B,l.b.p),cb=CABLES[l.type];
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2+Math.min(34,Math.abs(a.x-b.x)/5);
    const dd=`M${a.x} ${a.y} Q${mx} ${my} ${b.x} ${b.y}`;
    const path=el('path',{d:dd,class:'link'+(selLink===l.id?' sel':''),stroke:cb.c,opacity:l.up?.95:.35});
    if(!l.up)path.setAttribute('stroke-dasharray','5 5');
    if(cb.wifi)path.setAttribute('stroke-dasharray','2 6');
    if(l.broken){path.setAttribute('stroke','#ff4d6d');path.setAttribute('stroke-dasharray','2 7');path.setAttribute('opacity',.8)}
    path.dataset.link=l.id;
    gLinks.appendChild(path);
    const hit=el('path',{d:dd,class:'link hit'});hit.dataset.link=l.id;gLinks.appendChild(hit);
  });
  S.devices.forEach(d=>gDev.appendChild(drawDevice(d)));
  $('hudStat').innerHTML=`Perangkat <b>${S.devices.length}</b> · Link <b>${S.links.filter(l=>l.up).length}/${S.links.length}</b>`+
    (simOn?' · <b style="color:var(--led)">SIM AKTIF</b>':'');
  renderInspector();
}
function toast(m,kind){const t=$('toast');t.textContent=m;t.className='show '+(kind||'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='',2600)}
function banner(m){$('bannerTxt').textContent=m;$('banner').classList.add('show')}
function hideBanner(){$('banner').classList.remove('show')}

/* ── palette ───────────────────────────────── */
function buildPalette(){
  const box=$('palList');box.innerHTML='';
  CATS.forEach(([cat,label],ci)=>{
    const det=document.createElement('details');det.className='cat';if(ci<3)det.open=true;
    det.innerHTML=`<summary>${label}</summary>`;
    Object.values(T).filter(t=>t.cat===cat).forEach(t=>{
      const it=document.createElement('div');it.className='pit';it.draggable=true;it.dataset.key=t.key;
      const dummy={id:'x',key:t.key,x:0,y:0,ports:t.ports(),on:true,cfg:{ip:''}};
      const {w,h}=size(dummy);
      const svg=el('svg',{viewBox:`-4 -4 ${w+8} ${h+8}`});svg.appendChild(drawDevice(dummy,true));
      it.appendChild(svg);

      it.appendChild(d);

function centerWorld(){const r=cv.getBoundingClientRect();return toWorld(r.width/2,r.height/2)}
function toWorld(cx,cy){const r=cv.getBoundingClientRect();return{x:(cx-r.left-view.x)/view.k,y:(cy-r.top-view.y)/view.k}}
cv.addEventListener('dragover',e=>e.preventDefault());
cv.addEventListener('drop',e=>{e.preventDefault();const k=e.dataTransfer.getData('text/key');if(!k)return;
  snap();const p=toWorld(e.clientX,e.clientY);sel=addDevice(k,p.x-40,p.y-20).id;render()});

/* ── pan / zoom / drag ─────────────────────── */
let ptrs=new Map(),dragDev=null,dragOff=null,panFrom=null,pinch=null,lastTap=0,moved=false;
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:view.k,
    c:{x:(a.x+b.x)/2,y:(a.y+b.y)/2}};dragDev=panFrom=null;return}
  const gEl=e.target.closest('.dev'),lEl=e.target.closest('[data-link]');
  if(gEl){
    const d=dev(gEl.dataset.id);
    if(cableMode){pickPort(d);return}
    sel=d.id;selLink=null;
    const w=toWorld(e.clientX,e.clientY);dragDev=d;dragOff={x:w.x-d.x,y:w.y-d.y};
    const now=Date.now();
    if(now-lastTap<340&&lastTap_id===d.id){openConfig(d.id);dragDev=null}
    lastTap=now;lastTap_id=d.id;
    render();
  } else if(lEl){selLink=lEl.dataset.link;sel=null;render();showLinkInfo(lEl.dataset.link)}
  else{panFrom={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};sel=null;selLink=null;render()}
});
let lastTap_id=null;
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=true;
  if(pinch&&ptrs.size===2){const[a,b]=[...ptrs.values()];const nd=Math.hypot(a.x-b.x,a.y-b.y);
    const k=Math.max(.25,Math.min(2.6,pinch.k*nd/pinch.d));zoomAt(pinch.c.x,pinch.c.y,k);return}
  if(dragDev){const w=toWorld(e.clientX,e.clientY),g=(typeof SNAP!=='undefined'&&!SNAP)?1:20;
    dragDev.x=Math.round((w.x-dragOff.x)/g)*g;dragDev.y=Math.round((w.y-dragOff.y)/g)*g;render()}
  else if(panFrom){view.x=panFrom.vx+(e.clientX-panFrom.x);view.y=panFrom.vy+(e.clientY-panFrom.y);
    world.setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`)}
});
const endPtr=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
  if(dragDev&&moved)snap();dragDev=null;panFrom=null};
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,view.k*(e.deltaY<0?1.12:.89))},{passive:false});
function zoomAt(cx,cy,k){const r=cv.getBoundingClientRect();k=Math.max(.25,Math.min(2.6,k));
  const wx=(cx-r.left-view.x)/view.k,wy=(cy-r.top-view.y)/view.k;
  view.x=cx-r.left-wx*k;view.y=cy-r.top-wy*k;view.k=k;
  world.setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`)}
function zoomBy(f){const r=cv.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,view.k*f)}
function fitView(){
  if(!S.devices.length){view={x:120,y:80,k:1};return render()}
  const xs=S.devices.map(d=>d.x),ys=S.devices.map(d=>d.y);
  const x0=Math.min(...xs)-70,y0=Math.min(...ys)-70;
  const x1=Math.max(...S.devices.map(d=>d.x+size(d).w))+70,y1=Math.max(...S.devices.map(d=>d.y+size(d).h))+70;
  const r=cv.getBoundingClientRect();
  view.k=Math.max(.25,Math.min(1.6,Math.min(r.width/(x1-x0),r.height/(y1-y0))));
  view.x=(r.width-(x1-x0)*view.k)/2-x0*view.k;view.y=(r.height-(y1-y0)*view.k)/2-y0*view.k;render()}
function autoArrange(){
  snap();
  const order=['router','fiber','switch','poe','nvr','server','ap','cctv','end'];
  const rows={};S.devices.forEach(d=>{const c=tpl(d).cat;(rows[c]=rows[c]||[]).push(d)});
  let y=60;order.forEach(c=>{if(!rows[c])return;
    rows[c].forEach((d,i)=>{d.x=60+i*180;d.y=y});y+=140});
  fitView();toast('Topologi dirapikan')}

function toggleCable(){cableMode=!cableMode;$('btnCable').classList.toggle('on',cableMode);pending=null;
  if(cableMode)banner('Mode kabel: pilih perangkat pertama, lalu port sumber.');else hideBanner()}
function pickPort(d){
  const other=pending?dev(pending.d):null;
  openSheet(`Pilih port — ${d.name}`,tpl(d).model,[],()=>{
    const b=$('mBody');b.innerHTML='';
    if(pending)b.innerHTML=`<div class="note">Sumber: <b>${other.name}</b> · port <b>${pending.p}</b>. Sekarang pilih port tujuan.</div>`;
    else b.innerHTML=`<div class="note">Pilih port sumber pada ${d.name}, lalu pilih perangkat tujuan.</div>`;
    const grid=document.createElement('div');grid.className='pgrid';
    d.ports.forEach(p=>{
      const l=linkOf(d.id,p.name);
      const c=document.createElement('div');
      c.className='pchip '+(l?(l.up?'up':'down'):'down')+(p.kind!=='rj45'?' sfp':'');
      c.innerHTML=`${p.name}<span class="st">${p.kind==='wifi'?'RADIO':(l?'TERPAKAI':CONNS[p.kind])}</span>`;
      c.onclick=()=>{
        if(l&&p.kind!=='wifi')return toast('Port '+p.name+' sudah terpakai. Lepas kabel dulu.','er');
        if(!pending){pending={d:d.id,p:p.name};closeModal();banner(`Port ${p.name} dipilih. Ketuk perangkat tujuan.`)}
        else{if(pending.d===d.id)return toast('Pilih perangkat yang berbeda','er');chooseCable(pending,{d:d.id,p:p.name})}

function chooseCable(a,b){

    body.innerHTML=`<label class="f"><span>Jenis kabel</span><select id="cbT">${opts.map(([k,c])=>`<option value="${k}">${c.n}</option>`).join('')}</select></label>

      <div class="row"><span>Konektor sisi A</span><b>${CONNS[pa.kind]}</b></div>
      <div class="row"><span>Konektor sisi B</span><b>${CONNS[pb.kind]}</b></div>

}

function togglePower(id){snap();const d=dev(id);d.on=!d.on;render()}

document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select'))return;

<script>
/* ══════════════════════════════════════════════════════════════
   Mesin simulasi: daya, PoE, link, VLAN, DHCP, routing, ping
   ══════════════════════════════════════════════════════════════ */
function togglePower(id){snap();const d=dev(id);d.userOn=!(d.userOn!==false);render()}
function poeFed(d){
  const pin=d.ports.find(p=>p.poeIn);if(!pin)return false;
  const l=linkOf(d.id,pin.name);if(!l)return false;
  const pe=peer(l,d.id),src=dev(pe.d);if(!src)return false;
  const sp=port(src,pe.p);
  return !!(sp&&sp.poeOut&&sp.enabled&&src.on&&src.cfg.poe.on&&!d.poeDenied);
}
function poeUsage(d){return{used:d._poeUsed||0,budget:d.cfg.poe.budget||tpl(d).poeBudget||0}}
function poeActive(d,p){
  if(!p.poeOut||!p.enabled||!d.on||!d.cfg.poe.on)return false;
  const l=linkOf(d.id,p.name);if(!l)return false;
  const pe=peer(l,d.id),pd=dev(pe.d),pp=pd&&port(pd,pe.p);
  return !!(pp&&pp.poeIn&&pd.on);
}
function linkSpeed(l){
  const A=dev(l.a.d),B=dev(l.b.d);
  return Math.min(CABLES[l.type].sp,port(A,l.a.p).speed,port(B,l.b.p).speed);
}
function computeState(){
  S.devices.forEach(d=>{d.poeDenied=false;if(tpl(d).power!=='poe')d.on=d.userOn!==false});
  for(let i=0;i<4;i++){
    S.devices.filter(d=>tpl(d).feats.poe).forEach(sw=>{
      let used=0;const budget=sw.cfg.poe.budget||tpl(sw).poeBudget||0;
      sw.ports.filter(p=>p.poeOut).forEach(p=>{
        const l=linkOf(sw.id,p.name);if(!l)return;
        const pe=peer(l,sw.id),pd=dev(pe.d);if(!pd)return;
        const pp=port(pd,pe.p);if(!pp||!pp.poeIn)return;
        const w=tpl(pd).watt||0;
        if(!sw.on||!sw.cfg.poe.on||!p.enabled){pd.poeDenied=true;return}
        if(used+w>budget){pd.poeDenied=true}else{used+=w;pd.poeDenied=false}
      });
      sw._poeUsed=used;
    });
    S.devices.filter(d=>tpl(d).power==='poe').forEach(d=>{d.on=(d.userOn!==false)&&poeFed(d)});
  }
  S.links.forEach(l=>{
    const A=dev(l.a.d),B=dev(l.b.d);if(!A||!B){l.up=false;return}
    const pa=port(A,l.a.p),pb=port(B,l.b.p),c=CABLES[l.type];
    let up=!!(!l.broken&&A.on&&B.on&&pa&&pb&&pa.enabled&&pb.enabled&&c.kinds.includes(pa.kind)&&c.kinds.includes(pb.kind)&&!c.console);
    if(c.wifi){const ap=[A,B].find(x=>tpl(x).feats.wifi);up=up&&!!(ap&&ap.cfg.wifi.ssid)}
    l.up=up;
  });
  if(simOn)runDHCP();
}
function vlanAllowed(p,v){
  return String(p.allowed||'1-4094').split(',').some(s=>{
    const m=s.trim().match(/^(\d+)(?:-(\d+))?$/);if(!m)return false;
    const a=+m[1],b=m[2]?+m[2]:a;return v>=a&&v<=b});
}
function l2Reach(startId,startPort){
  const res=[],seen=new Set(),q=[];
  const hop=(fd,fp,vlan)=>{
    linksOf(fd,fp).forEach(l=>{
      if(!l.up)return;
      const pe=peer(l,fd),k=pe.d+'|'+pe.p+'|'+vlan;
      if(seen.has(k))return;seen.add(k);q.push({d:pe.d,p:pe.p,vlan});
    });
  };
  hop(startId,startPort,null);
  while(q.length){
    const{d:did,p:pn,vlan}=q.shift(),D2=dev(did);
    if(!D2||!D2.on)continue;
    const P=port(D2,pn);if(!P||!P.enabled)continue;
    const t=tpl(D2);
    if(t.feats.host)res.push({dev:did,port:pn,vlan});
    if(t.feats.sw&&!t.feats.unmanaged){
      if(P.mode==='trunk'&&vlan!==null&&!vlanAllowed(P,vlan))continue;
      if(P.mode==='access'&&vlan!==null&&vlan!==P.vlan)continue;
      const v=P.mode==='trunk'?(vlan===null?P.native:vlan):P.vlan;
      D2.ports.forEach(op=>{
        if(op.name===pn||!op.enabled)return;
        if(op.mode==='trunk'){if(vlanAllowed(op,v))hop(did,op.name,op.native===v?null:v)}
        else if(op.vlan===v)hop(did,op.name,null);
      });
    } else if(t.feats.sw||t.feats.br){
      D2.ports.forEach(op=>{if(op.name!==pn&&op.enabled)hop(did,op.name,vlan)});
    }
  }
  return res;
}
function reachSet(d){
  let out=[];d.ports.forEach(p=>{if(linkOf(d.id,p.name))out=out.concat(l2Reach(d.id,p.name))});
  return out;
}
const ip2n=ip=>ip.split('.').reduce((a,o)=>a*256+(+o),0);
const n2ip=n=>[24,16,8,0].map(s=>(n>>>s)&255).join('.');
const validIP=ip=>/^(\d{1,3}\.){3}\d{1,3}$/.test(ip||'')&&ip.split('.').every(o=>+o<256);
const sameNet=(a,b,m)=>validIP(a)&&validIP(b)&&validIP(m)&&((ip2n(a)&ip2n(m))===(ip2n(b)&ip2n(m)));
function ifaces(d){
  if(tpl(d).feats.l3)return d.ports.filter(p=>validIP(p.ip)).map(p=>({ip:p.ip,mask:p.mask||'255.255.255.0',port:p.name}));
  return validIP(d.cfg.ip)?[{ip:d.cfg.ip,mask:d.cfg.mask,port:(d.ports.find(p=>linkOf(d.id,p.name))||d.ports[0]).name}]:[];
}
function runDHCP(){
  S.devices.filter(s=>s.cfg.dhcp.on&&s.on&&validIP(s.cfg.dhcp.start)).forEach(srv=>{
    let n=ip2n(srv.cfg.dhcp.start);const end=validIP(srv.cfg.dhcp.end)?ip2n(srv.cfg.dhcp.end):n+50;
    const seen=new Set();
    reachSet(srv).forEach(r=>{
      const c=dev(r.dev);if(!c||seen.has(c.id)||c.id===srv.id)return;seen.add(c.id);
      if(!c.cfg.dhcpClient||tpl(c).feats.l3)return;
      if(c.cfg.ip&&c.cfg._dhcpAssigned!==true)return;
      if(n>end)return;
      c.cfg.ip=n2ip(n++);c.cfg.mask=srv.cfg.dhcp.gw?srv.cfg.mask||'255.255.255.0':'255.255.255.0';
      c.cfg.gw=srv.cfg.dhcp.gw;c.cfg.dns=srv.cfg.dhcp.dns;c.cfg._dhcpAssigned=true;
    });
  });
}
function ping(srcId,dstId){
  const A=dev(srcId),B=dev(dstId);
  if(!A||!B)return{ok:false,m:'Perangkat tidak ditemukan'};
  if(!A.on)return{ok:false,m:`${A.name} tidak menyala (cek daya / PoE).`};
  if(!B.on)return{ok:false,m:`${B.name} tidak menyala (cek daya / PoE).`};
  const ia=ifaces(A),ib=ifaces(B);
  if(!ia.length)return{ok:false,m:`${A.name} belum punya IP address.`};
  if(!ib.length)return{ok:false,m:`${B.name} belum punya IP address.`};
  const reach=reachSet(A).map(r=>r.dev);
  for(const a of ia)for(const b of ib){
    if(sameNet(a.ip,b.ip,a.mask)){
      if(reach.includes(B.id))return{ok:true,m:`Reply dari ${b.ip}: subnet sama, jalur L2 tersambung.`,path:pathOf(A.id,B.id)};
      return{ok:false,m:`Subnet sama (${a.ip} ↔ ${b.ip}) tetapi tidak ada jalur L2. Cek kabel, port disabled, atau VLAN yang tidak cocok.`};
    }
  }
  const gw=A.cfg.gw||(ia[0]&&'');
  if(!validIP(gw))return{ok:false,m:`Beda subnet dan ${A.name} belum punya default gateway.`};
  const R=S.devices.find(r=>tpl(r).feats.route&&ifaces(r).some(i=>i.ip===gw));
  if(!R)return{ok:false,m:`Gateway ${gw} tidak ditemukan pada router mana pun.`};
  if(!reach.includes(R.id))return{ok:false,m:`Gateway ${gw} tidak bisa dijangkau di layer 2 dari ${A.name}.`};
  const rr=reachSet(R).map(x=>x.dev);
  const direct=ifaces(R).some(i=>ib.some(b=>sameNet(i.ip,b.ip,i.mask)));
  const routed=(R.cfg.routes||[]).some(rt=>ib.some(b=>sameNet(rt.dst,b.ip,rt.mask)));
  if(!direct&&!routed)return{ok:false,m:`Router ${R.name} tidak punya interface atau static route menuju subnet ${ib[0].ip}.`};
  if(!rr.includes(B.id))return{ok:false,m:`Router ${R.name} tidak bisa menjangkau ${B.name} di layer 2.`};
  return{ok:true,m:`Reply dari ${ib[0].ip}: routing lewat ${R.name} (${gw}).`,path:pathOf(A.id,B.id)};
}
function pathOf(a,b){
  const prev={},q=[a],seen=new Set([a]);
  while(q.length){const c=q.shift();if(c===b)break;
    S.links.filter(l=>l.up&&(l.a.d===c||l.b.d===c)).forEach(l=>{
      const n=peer(l,c).d;if(!seen.has(n)){seen.add(n);prev[n]=c;q.push(n)}})}
  if(!seen.has(b))return[];
  const p=[b];while(p[0]!==a&&prev[p[0]])p.unshift(prev[p[0]]);return p;
}
function animate(path){
  gAnim.innerHTML='';if(path.length<2)return;
  const pts=path.map(id=>{const d=dev(id),{w,h}=size(d);return{x:d.x+w/2,y:d.y+h/2}});
  const c=el('circle',{r:5,fill:'#2ee6a0',opacity:.95});gAnim.appendChild(c);
  const glow=el('circle',{r:10,fill:'#2ee6a0',opacity:.2});gAnim.appendChild(glow);
  let seg=0,t=0;
  const step=()=>{
    if(seg>=pts.length-1){gAnim.innerHTML='';return}
    t+=.035;if(t>=1){t=0;seg++;return requestAnimationFrame(step)}
    const p=pts[seg],n=pts[seg+1],x=p.x+(n.x-p.x)*t,y=p.y+(n.y-p.y)*t;
    c.setAttribute('cx',x);c.setAttribute('cy',y);glow.setAttribute('cx',x);glow.setAttribute('cy',y);
    requestAnimationFrame(step);
  };requestAnimationFrame(step);
}
function toggleSim(){
  simOn=!simOn;$('btnSim').classList.toggle('on',simOn);
  if(simOn){snap();render();const bad=validate().filter(v=>v.lvl==='er').length;
    banner(bad?`Simulasi jalan. ${bad} masalah ditemukan — buka "Cek konfigurasi".`:'Simulasi berjalan. DHCP dijalankan, status port diperbarui.')}
  else{hideBanner();render()}
}
/* ══════════════════════════════════════════════════════════════
   Validasi konfigurasi
   ══════════════════════════════════════════════════════════════ */
function validate(){
  const out=[],ips={};
  S.devices.forEach(d=>{
    const t=tpl(d);
    if(t.power==='poe'&&!d.on)out.push({lvl:'er',d:d.name,m:d.poeDenied?'Tidak dapat daya PoE (budget habis atau port PoE mati).':'Belum mendapat daya PoE. Sambungkan ke port PoE switch.'});
    if(t.feats.host&&d.on&&!ifaces(d).length&&!d.cfg.dhcpClient)out.push({lvl:'wr',d:d.name,m:'Belum punya IP address dan bukan DHCP client.'});
    ifaces(d).forEach(i=>{(ips[i.ip]=ips[i.ip]||[]).push(d.name)});
    if(t.feats.wifi&&!d.cfg.wifi.ssid)out.push({lvl:'wr',d:d.name,m:'SSID belum dibuat.'});
    if(t.feats.wifi&&d.cfg.wifi.ssid&&d.cfg.wifi.sec!=='Open'&&(d.cfg.wifi.pass||'').length<8)
      out.push({lvl:'er',d:d.name,m:'Password WiFi minimal 8 karakter.'});
    if(t.feats.poe){const u=poeUsage(d);if(u.used>u.budget)out.push({lvl:'er',d:d.name,m:`PoE over budget: ${u.used}W dari ${u.budget}W.`})}
    if(t.feats.cam&&d.on){
      const nvr=S.devices.find(n=>tpl(n).feats.nvr);
      if(nvr&&!ping(d.id,nvr.id).ok)out.push({lvl:'wr',d:d.name,m:`Tidak bisa menjangkau ${nvr.name}. Stream tidak akan masuk.`});
    }
    if(d.on&&!d.ports.some(p=>linkOf(d.id,p.name))&&!t.feats.client)
      out.push({lvl:'wr',d:d.name,m:'Belum ada kabel yang terpasang.'});
    if(t.feats.route&&d.on&&!ifaces(d).length)out.push({lvl:'er',d:d.name,m:'Router belum punya IP di interface mana pun.'});
    if(d.cfg.gw&&validIP(d.cfg.gw)&&ifaces(d).length&&!ifaces(d).some(i=>sameNet(i.ip,d.cfg.gw,i.mask)))
      out.push({lvl:'er',d:d.name,m:`Gateway ${d.cfg.gw} berada di luar subnet interface.`});
  });
  Object.entries(ips).forEach(([ip,who])=>{if(who.length>1)out.push({lvl:'er',d:who.join(', '),m:`IP duplikat: ${ip}`})});
  S.links.forEach(l=>{if(!l.up&&!CABLES[l.type].console&&dev(l.a.d)&&dev(l.b.d)){
    const A=dev(l.a.d),B=dev(l.b.d);
    out.push({lvl:'wr',d:`${A.name}:${l.a.p} ↔ ${B.name}:${l.b.p}`,m:'Link DOWN. Cek daya, port disabled, atau jenis kabel.'})}});
  return out;
}
function openCheck(){
  computeState();
  openSheet('Cek konfigurasi',S.name,[],()=>{
    const v=validate(),b=$('mBody');
    const er=v.filter(x=>x.lvl==='er'),wr=v.filter(x=>x.lvl==='wr');
    b.innerHTML=(v.length?'':'<div class="note ok">Tidak ada masalah terdeteksi. Topologi siap diuji.</div>')+
      `<div class="note">Ringkasan: <b style="color:var(--red)">${er.length} error</b> · <b style="color:var(--amber)">${wr.length} peringatan</b> · ${S.devices.length} perangkat · ${S.links.length} kabel.</div>`+
      v.map(x=>`<div class="row"><span style="flex:1"><span class="tag ${x.lvl}">${x.lvl==='er'?'ERROR':'WARN'}</span> ${x.d}</span><b style="max-width:60%;text-align:right;white-space:normal">${x.m}</b></div>`).join('');
  });
}
function openTest(){
  const hosts=S.devices.filter(d=>tpl(d).feats.host);
  openSheet('Uji koneksi (ping)','Pilih sumber dan tujuan',[],()=>{
    const b=$('mBody');
    if(hosts.length<2)return b.innerHTML='<div class="note wr">Butuh minimal dua perangkat ber-IP di kanvas.</div>';
    const opt=h=>hosts.map(d=>`<option value="${d.id}">${d.name} — ${primaryIP(d)||'no IP'}</option>`).join('');
    b.innerHTML=`<div class="fgrid">
      <label class="f"><span>Dari</span><select id="pgA">${opt()}</select></label>
      <label class="f"><span>Ke</span><select id="pgB">${opt()}</select></label></div>
      <button class="btn pri" id="pgGo">Kirim ping</button><div id="pgOut"></div>`;
    $('pgB').selectedIndex=Math.min(1,hosts.length-1);
    $('pgGo').onclick=()=>{
      computeState();
      const r=ping($('pgA').value,$('pgB').value);
      const path=(r.path||[]).map(id=>dev(id).name).join('  →  ');
      $('pgOut').innerHTML=`<div class="note ${r.ok?'ok':'er'}" style="margin-top:14px">
        <b>${r.ok?'PING BERHASIL':'PING GAGAL'}</b><br>${r.m}${path?`<br><br><span style="font-family:var(--mono);font-size:11.5px">Jalur: ${path}</span>`:''}</div>`;
      if(r.ok&&r.path){closeModal();animate(r.path);toast('Ping berhasil — traffic dianimasikan','ok')}
    };
  });
}
</script>

  }

    b.innerHTML=`<div class="note">Yang disimulasikan: <b>static route</b> dan <b>default route</b>. RIP/OSPF/BGP bisa diaktifkan sebagai catatan desain, tetapi belum ikut dihitung mesin simulasi.</div>

      <label class="f"><span>VLAN SSID</span><input value="${w.vlan}" onchange="setC('cfg.wifi.vlan',+this.value||1)"></label>
      <label class="f"><span>Channel</span><select onchange="setC('cfg.wifi.ch',this.value)">${['auto','1','6','11','36','44','149','157'].map(c=>`<option ${w.ch===c?'selected':''}>${c}</option>`).join('')}</select></label>
      <label class="f"><span>Channel width</span><select onchange="setC('cfg.wifi.bw',this.value)">${['20 MHz','40 MHz','80 MHz','160 MHz'].map(c=>`<option ${w.bw===c?'selected':''}>${c}</option>`).join('')}</select></label>
      <label class="f"><span>TX Power</span><select onchange="setC('cfg.wifi.tx',this.value)">${['Low','Medium','High','Auto'].map(c=>`<option ${w.tx===c?'selected':''}>${c}</option>`).join('')}</select></label>
    </div>
    <div class="row"><span>Band aktif</span><b>${bands.map(x=>x+' GHz').join(' · ')}${t.feats.bands&&t.feats.bands.includes('6')?'':''}</b></div>
    <div class="row"><span>Client terasosiasi</span><b>${clients.length?clients.map(c=>c.name).join(', '):'—'}</b></div>
    <div class="note" style="margin-top:12px">Untuk menghubungkan client: aktifkan <b>Pasang kabel</b>, pilih port <b>wlan0</b> pada laptop/HP, lalu pilih AP ini dan kabel <b>Wireless (asosiasi)</b>.</div>`;
  }
  else if(CURTAB==='WiFi Client'){
    const aps=S.devices.filter(x=>tpl(x).feats.wifi&&x.cfg.wifi.ssid);
    b.innerHTML=`<div class="note">Daftar SSID yang terdeteksi di kanvas. Asosiasi dibuat lewat kabel <b>Wireless</b> dari port wlan0.</div>
    <table><tr><th>SSID</th><th>AP</th><th>Security</th><th>VLAN</th><th>Status</th></tr>
    ${aps.length?aps.map(a=>{const l=S.links.find(l=>CABLES[l.type].wifi&&((l.a.d===d.id&&l.b.d===a.id)||(l.b.d===d.id&&l.a.d===a.id)));
      return `<tr><td>${a.cfg.wifi.ssid}</td><td>${a.name}</td><td>${a.cfg.wifi.sec}</td><td>${a.cfg.wifi.vlan}</td>
      <td><span class="tag ${l&&l.up?'up':'dn'}">${l?(l.up?'CONNECTED':'DOWN'):'—'}</span></td></tr>`}).join('')
      :'<tr><td colspan="5">Belum ada SSID aktif.</td></tr>'}</table>`;
  }
  else if(CURTAB==='PoE'){
    const u=poeUsage(d);
    b.innerHTML=`<div class="fgrid">
      <label class="f"><span>PoE global</span><select onchange="setC('cfg.poe.on',this.value==='on')">
        <option value="on" ${d.cfg.poe.on?'selected':''}>Aktif</option><option value="off" ${!d.cfg.poe.on?'selected':''}>Nonaktif</option></select></label>
      <label class="f"><span>Power budget (W)</span><input value="${u.budget}" onchange="setC('cfg.poe.budget',+this.value||0)"></label></div>
    <div class="note ${u.used>u.budget?'er':'ok'}">Terpakai <b>${u.used}W</b> dari <b>${u.budget}W</b> · sisa ${Math.max(0,u.budget-u.used)}W</div>
    <table><tr><th>Port</th><th>PoE</th><th>Perangkat</th><th>Daya</th><th>Class</th><th>Status</th></tr>
    ${d.ports.filter(p=>p.poeOut).map(p=>{const l=linkOf(d.id,p.name);const pd=l?dev(peer(l,d.id).d):null;
      const w=pd?(tpl(pd).watt||0):0,cls=w===0?'—':w<=4?'Class 1':w<=7?'Class 2':w<=13?'Class 3':w<=25?'Class 4':'Class 5';
      return `<tr><td>${p.name}</td>
        <td><input type="checkbox" ${p.enabled?'checked':''} onchange="setP('${p.name}','enabled',this.checked)"></td>
        <td>${pd?pd.name:'—'}</td><td>${w?w+'W':'—'}</td><td>${cls}</td>
        <td><span class="tag ${pd?(pd.on?'up':'er'):'dn'}">${pd?(pd.on?'POWERED':'DENIED'):'IDLE'}</span></td></tr>`}).join('')}</table>`;
  }
  else if(CURTAB==='CLI')drawCLI();
  else if(CURTAB==='Tutorial')drawTutorial();
}
function fmtUp(ms){const s=Math.floor(ms/1000);return `${Math.floor(s/3600)}j ${Math.floor(s%3600/60)}m ${s%60}d`}
function addVlan(){const id=+$('nvId').value;if(!id||id<1||id>4094)return toast('VLAN ID harus 1–4094','er');
  if(CUR.cfg.vlans.some(v=>v.id===id))return toast('VLAN sudah ada','er');
  CUR.cfg.vlans.push({id,name:$('nvNm').value||('VLAN'+id)});drawTab();toast('VLAN '+id+' dibuat','ok')}
function delVlan(id){CUR.cfg.vlans=CUR.cfg.vlans.filter(v=>v.id!==id);
  CUR.ports.forEach(p=>{if(p.vlan===id)p.vlan=1});drawTab();render()}
function addRoute(){const dst=$('rDst').value.trim(),mask=$('rMask').value.trim(),gw=$('rGw').value.trim();
  if(!validIP(dst)||!validIP(gw))return toast('Format IP tidak valid','er');
  CUR.cfg.routes.push({dst,mask:mask||'0.0.0.0',gw});drawTab();toast('Route ditambahkan','ok')}
</script>
<script>
/* ══════════════════════════════════════════════════════════════
   Terminal CLI
   ══════════════════════════════════════════════════════════════ */
function promptOf(d){
  const n=d.cfg.hostname||d.name;
  if(tpl(d).cli==='mikrotik')return `[admin@${n}] > `;
  const m=d.cli.mode;
  return n+(m==='user'?'> ':m==='enable'?'# ':m==='config'?'(config)# ':m==='if'?`(config-if)# `:m==='vlan'?'(config-vlan)# ':'# ');
}
function drawCLI(){
  const d=CUR;
  $('mBody').innerHTML=`<div class="note">Terminal ${tpl(d).cli==='mikrotik'?'RouterOS':tpl(d).cli==='cisco'?'Cisco IOS':'Ruijie'} (subset perintah). Ketik <code>?</code> untuk daftar perintah.</div>
    <div id="term"></div><div class="cmdline"><span id="prompt">${promptOf(d)}</span>
    <input id="cmd" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ketik perintah lalu Enter"></div>`;
  const term=$('term');
  const paint=()=>{term.innerHTML=d.cli.log.map(l=>`<div class="${l.k||''}">${l.t.replace(/</g,'&lt;')}</div>`).join('');term.scrollTop=term.scrollHeight};
  if(!d.cli.log.length)d.cli.log.push({t:`Welcome to ${tpl(d).model}`,k:'ok'});
  paint();
  const inp=$('cmd');inp.focus();
  inp.onkeydown=e=>{
    if(e.key!=='Enter')return;
    const line=inp.value;inp.value='';
    d.cli.log.push({t:promptOf(d)+line,k:'in'});
    cliRun(d,line.trim()).forEach(o=>d.cli.log.push(o));
    if(d.cli.log.length>300)d.cli.log=d.cli.log.slice(-300);
    $('prompt').textContent=promptOf(d);paint();render();
  };
}
function cliRun(d,line){
  const out=[],say=(t,k)=>out.push({t,k});
  if(!line)return out;
  const brand=tpl(d).cli,w=line.split(/\s+/);
  if(line==='?'){
    say(brand==='mikrotik'
      ?'/ip address add address=<ip>/<cidr> interface=<if>\n/ip address print\n/interface print\n/interface enable|disable <if>\n/ip pool add name=<n> ranges=<a>-<b>\n/system identity set name=<n>\n/ping <ip>'
      :'enable\nconfigure terminal\nhostname <n>\nvlan <id> [name <n>]\ninterface <name>\n ip address <ip> <mask>\n switchport mode access|trunk\n switchport access vlan <id>\n switchport trunk allowed vlan <list>\n description <text>\n shutdown | no shutdown\n poe enable | poe disable\nshow ip interface brief | show vlan | show poe | show running-config\nexit | end | write','ok');
    return out;
  }
  if(brand==='mikrotik'){
    const m=line.match(/^\/ip address add address=([\d.]+)\/(\d+)\s+interface=(\S+)/);
    if(m){const p=port(d,m[3]);if(!p)return say('failure: interface not found','er'),out;
      p.ip=m[1];p.mask=cidr2mask(+m[2]);if(!tpl(d).feats.l3){d.cfg.ip=m[1];d.cfg.mask=p.mask}
      return say('address added','ok'),out}
    if(/^\/ip address print/.test(line)){
      say(' #   ADDRESS            INTERFACE');
      d.ports.filter(p=>p.ip).forEach((p,i)=>say(` ${i}   ${p.ip}/${mask2cidr(p.mask)}  ${p.name}`));return out}
    if(/^\/interface print/.test(line)){
      say(' #   NAME        STATUS   SPEED');
      d.ports.forEach((p,i)=>{const l=linkOf(d.id,p.name);
        say(` ${i}   ${p.name.padEnd(11)} ${(l&&l.up?'running':'down').padEnd(8)} ${fmtSpeed(p.speed)}`)});return out}
    let mm=line.match(/^\/interface (enable|disable) (\S+)/);
    if(mm){const p=port(d,mm[2]);if(!p)return say('no such item','er'),out;p.enabled=mm[1]==='enable';return say('ok','ok'),out}
    mm=line.match(/^\/system identity set name=(\S+)/);
    if(mm){d.cfg.hostname=mm[1];d.name=mm[1];return say('ok','ok'),out}
    mm=line.match(/^\/ip pool add name=(\S+) ranges=([\d.]+)-([\d.]+)/);
    if(mm){d.cfg.dhcp.start=mm[2];d.cfg.dhcp.end=mm[3];d.cfg.dhcp.on=true;return say('pool added','ok'),out}
    mm=line.match(/^\/?ping ([\d.]+)/);
    if(mm){return pingCLI(d,mm[1],say),out}
    say('bad command name or invalid syntax','er');return out;
  }
  // Cisco / Ruijie (IOS-like)
  const M=d.cli;
  const need=(mode,ok)=>{if(!ok){say('% Perintah tidak tersedia pada mode ini','er');return false}return true};
  if(/^(en|enable)$/.test(line)){M.mode='enable';return say(''),out}
  if(/^(conf t|configure terminal)$/.test(line)){if(!need(0,M.mode!=='user'))return out;M.mode='config';return say('Enter configuration commands, one per line.'),out}
  if(/^exit$/.test(line)){M.mode=M.mode==='if'||M.mode==='vlan'?'config':M.mode==='config'?'enable':'user';M.ctx=null;return out}
  if(/^end$/.test(line)){M.mode='enable';M.ctx=null;return out}
  if(/^(write|write memory|copy run start)$/.test(line))return say('Building configuration... [OK]','ok'),out;
  let m;
  if((m=line.match(/^hostname (\S+)/))&&M.mode==='config'){d.cfg.hostname=m[1];d.name=m[1];return out}
  if((m=line.match(/^vlan (\d+)$/))&&M.mode==='config'){
    const id=+m[1];if(!d.cfg.vlans.some(v=>v.id===id))d.cfg.vlans.push({id,name:'VLAN'+id});
    M.mode='vlan';M.ctxVlan=id;return out}
  if((m=line.match(/^name (\S+)/))&&M.mode==='vlan'){
    const v=d.cfg.vlans.find(v=>v.id===M.ctxVlan);if(v)v.name=m[1];return out}
  if((m=line.match(/^interface (.+)$/i))&&(M.mode==='config'||M.mode==='if')){
    const q=m[1].replace(/\s+/g,'').toLowerCase();
    const p=d.ports.find(p=>p.name.replace(/\s+/g,'').toLowerCase()===q)||
            d.ports.find(p=>p.name.toLowerCase().endsWith(q))||
            d.ports.find(p=>p.name.toLowerCase().replace(/[a-z]/g,'')===q.replace(/[a-z]/g,''));
    if(!p)return say('% Invalid interface','er'),out;
    M.mode='if';M.ctx=p.name;return out}
  if(M.mode==='if'){
    const p=port(d,M.ctx);
    if((m=line.match(/^ip address ([\d.]+) ([\d.]+)/))){p.ip=m[1];p.mask=m[2];if(!tpl(d).feats.l3){d.cfg.ip=m[1];d.cfg.mask=m[2]}return say(''),out}
    if(/^no shutdown$/.test(line)){p.enabled=true;return say('%LINK-3-UPDOWN: Interface '+p.name+', changed state to up','ok'),out}
    if(/^shutdown$/.test(line)){p.enabled=false;return say('%LINK-5-CHANGED: Interface '+p.name+', changed state to administratively down','ok'),out}
    if((m=line.match(/^switchport mode (access|trunk)/))){p.mode=m[1];return out}
    if((m=line.match(/^switchport access vlan (\d+)/))){
      const id=+m[1];if(!d.cfg.vlans.some(v=>v.id===id))d.cfg.vlans.push({id,name:'VLAN'+id});
      p.vlan=id;p.mode='access';return out}
    if((m=line.match(/^switchport trunk allowed vlan (\S+)/))){p.allowed=m[1];p.mode='trunk';return out}
    if((m=line.match(/^switchport trunk native vlan (\d+)/))){p.native=+m[1];return out}
    if((m=line.match(/^description (.+)/))){p.desc=m[1];return out}
    if(/^poe enable$/.test(line)){p.poeOut=true;p.enabled=true;return out}
    if(/^poe disable$/.test(line)){p.enabled=false;return out}
  }
  if(/^show ip interface brief/.test(line)){
    say('Interface              IP-Address      Status     Protocol');
    d.ports.forEach(p=>{const l=linkOf(d.id,p.name);
      say(`${p.name.padEnd(22)} ${(p.ip||'unassigned').padEnd(15)} ${(p.enabled?'up':'admin down').padEnd(10)} ${l&&l.up?'up':'down'}`)});
    return out}
  if(/^show vlan/.test(line)){
    say('VLAN Name        Status   Ports');
    d.cfg.vlans.forEach(v=>say(`${String(v.id).padEnd(4)} ${v.name.padEnd(11)} active   ${d.ports.filter(p=>p.mode==='access'&&p.vlan===v.id).map(p=>p.name).join(', ')}`));
    return out}
  if(/^show poe/.test(line)){
    const u=poeUsage(d);say(`Total budget: ${u.budget}W  Used: ${u.used}W  Free: ${Math.max(0,u.budget-u.used)}W`);
    d.ports.filter(p=>p.poeOut).forEach(p=>{const l=linkOf(d.id,p.name),pd=l?dev(peer(l,d.id).d):null;
      say(`${p.name.padEnd(10)} ${(pd?(pd.on?'delivering':'denied'):'idle').padEnd(12)} ${pd?(tpl(pd).watt||0)+'W':'0W'}`)});
    return out}
  if(/^show running-config/.test(line)){
    say('hostname '+(d.cfg.hostname||d.name));
    d.cfg.vlans.forEach(v=>say(`vlan ${v.id}\n name ${v.name}`));
    d.ports.forEach(p=>{say(`interface ${p.name}`);
      if(p.desc)say(' description '+p.desc);
      if(p.ip)say(` ip address ${p.ip} ${p.mask}`);
      if(tpl(d).feats.sw)say(p.mode==='trunk'?` switchport mode trunk\n switchport trunk allowed vlan ${p.allowed}`:` switchport mode access\n switchport access vlan ${p.vlan}`);
      if(!p.enabled)say(' shutdown')});
    return out}
  if((m=line.match(/^ping ([\d.]+)/)))return pingCLI(d,m[1],say),out;
  say('% Invalid input detected at "^" marker.','er');return out;
}
function pingCLI(d,ip,say){
  computeState();
  const target=S.devices.find(x=>ifaces(x).some(i=>i.ip===ip));
  if(!target)return say(`Request timed out. Tidak ada perangkat dengan IP ${ip}.`,'er');
  const r=ping(d.id,target.id);
  if(r.ok){say(`Pinging ${ip} ...`);say('Reply from '+ip+': bytes=64 time=1ms TTL=64','ok');
    say('Reply from '+ip+': bytes=64 time=1ms TTL=64','ok');say('Success rate is 100 percent (2/2)','ok');animate(r.path||[])}
  else say('Request timed out. '+r.m,'er');
}
const cidr2mask=c=>n2ip(c===0?0:(0xFFFFFFFF<<(32-c))>>>0);
const mask2cidr=m=>validIP(m)?(ip2n(m).toString(2).match(/1/g)||[]).length:24;
</script>

function tutChecks(d){
  const t=tpl(d),c=[],up=d.ports.filter(p=>{const l=linkOf(d.id,p.name);return l&&l.up});
  const push=(t2,ok,h)=>c.push({t:t2,ok:!!ok,h});
  push('Perangkat menyala',d.on,t.power==='poe'?'Sambungkan port Uplink ke port PoE switch yang aktif.':'Nyalakan lewat tombol di panel detail.');
  push('Minimal satu kabel terpasang dan link UP',up.length>0,'Aktifkan mode Pasang kabel, pilih port sumber lalu port tujuan.');
  if(t.feats.host)push('Punya IP address',ifaces(d).length>0,'Isi IP di tab Network, atau aktifkan DHCP client lalu jalankan simulasi.');
  if(t.feats.wifi){
    push('SSID sudah dibuat',d.cfg.wifi.ssid,'Buka tab Wireless dan isi kolom SSID.');
    push('Password minimal 8 karakter',d.cfg.wifi.sec==='Open'||(d.cfg.wifi.pass||'').length>=8,'Isi password WiFi di tab Wireless.');
    push('Ada client terasosiasi',S.links.some(l=>CABLES[l.type].wifi&&l.up&&(l.a.d===d.id||l.b.d===d.id)),'Tarik kabel Wireless dari port wlan0 laptop/HP ke AP ini.');
  }
  if(t.feats.sw&&!t.feats.unmanaged)push('Minimal satu VLAN selain default',d.cfg.vlans.length>1,'Buat VLAN baru di tab VLAN, lalu set port access-nya.');
  if(t.feats.poe){const u=poeUsage(d);push('PoE dalam budget',u.used<=u.budget,`Kurangi perangkat PoE atau pakai switch dengan budget lebih besar dari ${u.used}W.`)}
  if(t.feats.route){
    push('Ada IP di interface LAN',ifaces(d).length>0,'Isi IP interface di tab Network.');
    push('DHCP server aktif',d.cfg.dhcp.on,'Aktifkan DHCP server di tab DHCP dan isi pool.');
  }
  if(t.feats.cam){const nvr=S.devices.find(n=>tpl(n).feats.nvr);
    push('Terjangkau dari NVR',nvr?ping(d.id,nvr.id).ok:false,'Pastikan kamera dan NVR satu subnet dan satu VLAN.')}
  if(t.feats.client){const gw=d.cfg.gw;
    push('Gateway terisi',validIP(gw),'Isi default gateway di tab Network atau dapatkan dari DHCP.')}
  return c;
}
function drawTutorial(){
  const d=CUR,t=tpl(d),k=TUT[t.cat]||TUT.end,c=tutChecks(d),done=c.filter(x=>x.ok).length;
  const secs=[
    ['Pengenalan perangkat',k.intro],['Fungsi perangkat',k.fungsi],['Topologi penggunaan',k.topo],
    ['Cara menghubungkan kabel',k.kabel],['Konfigurasi IP',k.ip],['Konfigurasi VLAN',k.vlan],
    ['Konfigurasi DHCP',k.dhcp],['Konfigurasi routing',k.route],['Konfigurasi WiFi',k.wifi],
    ['Konfigurasi PoE',k.poe],['Cara testing',G.test],['Troubleshooting',G.tshoot]];
  const cliHint=t.cli==='mikrotik'?`<div class="note" style="margin-top:12px"><b>Contoh CLI RouterOS</b><br><code>/ip address add address=192.168.10.1/24 interface=ether2</code></div>`
    :t.cli?`<div class="note" style="margin-top:12px"><b>Contoh CLI ${t.cli==='cisco'?'Cisco':'Ruijie'}</b><br><code>enable</code> → <code>configure terminal</code> → <code>vlan 10</code> → <code>interface ${d.ports[0].name}</code> → <code>switchport mode access</code> → <code>switchport access vlan 10</code></div>`:'';
  $('mBody').innerHTML=`
  <div class="note ${done===c.length?'ok':''}"><b>Progres praktik: ${done}/${c.length}</b> — checklist ini mengecek topologi kamu secara langsung.</div>
  ${c.map(x=>`<div class="step ${x.ok?'done':''}"><h5>${x.t} ${x.ok?'<span class="tag up">OK</span>':'<span class="tag dn">BELUM</span>'}</h5>
    ${x.ok?'':`<p>${x.h}</p>`}</div>`).join('')}
  <button class="btn" onclick="computeState();drawTutorial()">Periksa ulang</button>
  <h4 style="margin:20px 0 10px;font-size:11px;letter-spacing:.14em;color:var(--mut)">PANDUAN LENGKAP</h4>
  ${secs.map(([h,p],i)=>`<div class="step done"><h5>${i+1}. ${h}</h5><p>${p}</p></div>`).join('')}
  ${cliHint}`;
}
/* ══════════════════════════════════════════════════════════════
   Project: simpan, buka, ekspor, impor
   ══════════════════════════════════════════════════════════════ */
const LS='netlab.projects',LAST='netlab.last';
const store=()=>{try{return JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){return{}}};
function openProjects(){
  openSheet('Project',S.name,[],()=>{
    const p=store();
    $('mBody').innerHTML=`<div class="fgrid">
      <label class="f"><span>Nama project</span><input id="pjN" value="${S.name}"></label></div>
      <button class="btn pri" onclick="saveProject()">Simpan project</button>
      <button class="btn" onclick="newProject()">Project baru (kosong)</button>
      <button class="btn" onclick="exportJSON()">Ekspor file .json</button>
      <label class="btn" style="text-align:center">Impor file .json
        <input type="file" accept=".json" style="display:none" onchange="importJSON(this)"></label>
      <h4 style="margin:18px 0 8px;font-size:11px;letter-spacing:.14em;color:var(--mut)">TERSIMPAN DI PERANGKAT INI</h4>
      ${Object.keys(p).length?Object.entries(p).map(([n,v])=>`<div class="row"><span style="flex:1">${n}<br><span style="font-size:10px;color:var(--dim)">${v.devices.length} perangkat · ${v.links.length} kabel</span></span>
        <b><button class="tab" onclick="loadProject('${n.replace(/'/g,"\\'")}')">buka</button>
        <button class="tab" onclick="delProject('${n.replace(/'/g,"\\'")}')">hapus</button></b></div>`).join('')
        :'<div class="note">Belum ada project tersimpan.</div>'}
      <div class="note" style="margin-top:14px">Penyimpanan memakai localStorage browser, jadi butuh HTTPS (GitHub Pages) agar tersimpan permanen di Safari iOS. Untuk cadangan, pakai Ekspor .json.</div>`;
  });
}
function saveProject(){
  const n=$('pjN').value.trim();if(!n)return toast('Isi nama project','er');
  S.name=n;const p=store();p[n]=S;
  try{localStorage.setItem(LS,JSON.stringify(p));toast('Project "'+n+'" tersimpan','ok');openProjects()}
  catch(e){toast('Gagal menyimpan: penyimpanan penuh atau diblokir','er')}
}
function loadProject(n){const p=store();if(!p[n])return;snap();S=JSON.parse(JSON.stringify(p[n]));sel=null;closeModal();fitView();toast('Project "'+n+'" dibuka','ok')}
function delProject(n){const p=store();delete p[n];localStorage.setItem(LS,JSON.stringify(p));openProjects();toast('Project dihapus')}
function newProject(){if(!confirm('Kosongkan kanvas?'))return;snap();S={devices:[],links:[],name:'Topologi baru',ver:1};sel=null;closeModal();render();fitView()}
function exportJSON(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=(S.name||'netlab').replace(/\s+/g,'_')+'.json';a.click();toast('File diekspor','ok');
}
function importJSON(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.devices)throw 0;snap();S=j;sel=null;closeModal();fitView();toast('Project diimpor','ok')}
    catch(e){toast('File tidak valid','er')}};
  r.readAsText(f);
}
setInterval(()=>{try{localStorage.setItem(LAST,JSON.stringify(S))}catch(e){}},4000);

/* ══════════════════════════════════════════════════════════════
   Contoh topologi & inisialisasi
   ══════════════════════════════════════════════════════════════ */
function starter(){
  const R=addDevice('mt-hex',60,120),SW=addDevice('rj-nbs3100-8p',300,120),
        AP=addDevice('rj-rap2260',600,40),CAM=addDevice('hik-bullet',600,180),
        NVR=addDevice('hik-7608',300,300),LT=addDevice('laptop',790,40);
  R.name='Router-Utama';SW.name='PoE-Switch-1';AP.name='AP-Lobby';CAM.name='CAM-Parkir';NVR.name='NVR-Server';LT.name='Laptop-Tamu';
  port(R,'ether2').ip='192.168.10.1';port(R,'ether2').mask='255.255.255.0';
  R.cfg.dhcp={on:true,net:'192.168.10.0/24',start:'192.168.10.100',end:'192.168.10.200',gw:'192.168.10.1',dns:'8.8.8.8',lease:'12h',excl:''};
  R.cfg.routes=[{dst:'0.0.0.0',mask:'0.0.0.0',gw:'192.168.1.1'}];
  SW.cfg.ip='192.168.10.2';SW.cfg.gw='192.168.10.1';
  NVR.cfg.ip='192.168.10.50';NVR.cfg.gw='192.168.10.1';
  CAM.cfg.ip='192.168.10.51';CAM.cfg.gw='192.168.10.1';CAM.cfg.dhcpClient=false;
  AP.cfg.dhcpClient=true;AP.cfg.wifi.ssid='Galaxy-WiFi';AP.cfg.wifi.pass='galaxy2026';
  LT.cfg.dhcpClient=true;
  const L=(a,ap,b,bp,type)=>S.links.push({id:uid('l'),a:{d:a.id,p:ap},b:{d:b.id,p:bp},type,cores:0,up:false});
  L(R,'ether2',SW,'Gi0/8','cat6');
  L(SW,'Gi0/1',AP,'Uplink','cat6');
  L(SW,'Gi0/2',CAM,'LAN','cat6');
  L(SW,'Gi0/3',NVR,'LAN','cat6');
  L(LT,'wlan0',AP,'wlan0','wifi');
}
function boot(){
  buildPalette();drawGrid();
  let loaded=false;
  try{const j=JSON.parse(localStorage.getItem(LAST)||'null');if(j&&j.devices&&j.devices.length){S=j;loaded=true}}catch(e){}
  if(!loaded)starter();
  render();fitView();
  if(!loaded)setTimeout(()=>banner('Contoh topologi dimuat. Ketuk dua kali perangkat untuk konfigurasi.'),600);
}
boot();

    lt=setTimeout(()=>{sel=g.dataset.id;render();showCtx(e.clientX,e.clientY,g.dataset.id)},620)},true);

function dupDevice(id){
  id=id||sel;if(!id)return toast('Pilih perangkat dulu','er');
  const src=dev(id);snap();
  const c=JSON.parse(JSON.stringify(src));
  c.id=uid('d');c.x=src.x+40;c.y=src.y+40;c.mac=macGen();c.serial='SN'+Math.random().toString(36).slice(2,10).toUpperCase();
  const base=src.name.replace(/-\d+$/,'');let n=2;while(S.devices.some(d=>d.name===base+'-'+n))n++;
  c.name=base+'-'+n;c.cfg.ip='';c.ports.forEach(p=>p.ip='');
  S.devices.push(c);sel=c.id;render();log('Perangkat diduplikasi: '+c.name,'ok');toast(c.name+' dibuat')
}

{id:'ip',t:'IP Address',
 x:`IP address adalah alamat unik setiap perangkat di jaringan, ditulis dalam empat oktet seperti <code>192.168.10.25</code>. Alamat ini selalu berpasangan dengan <b>subnet mask</b> (misalnya 255.255.255.0 atau /24) yang menentukan bagian mana dari alamat itu adalah alamat jaringan dan bagian mana alamat host.<br><br>Di jaringan lokal Indonesia, blok privat yang paling sering dipakai adalah 192.168.x.x, lalu 10.x.x.x untuk jaringan besar. Alamat pertama pada satu blok dipakai sebagai alamat network dan alamat terakhir sebagai broadcast, jadi keduanya tidak boleh dipasang ke perangkat.`,
